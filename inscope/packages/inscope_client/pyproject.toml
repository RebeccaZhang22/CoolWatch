[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inscope"
version = "0.4.0"
description = "InScope client: talk to an InScope detection API without importing server code"
requires-python = ">=3.11"
dependencies = ["inscope-contract", "httpx"]

[tool.setuptools.packages.find]
include = ["inscope*"]
