[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inscope-contract"
version = "0.4.0"
description = "InScope frozen wire/feature contract shared by server, engine and client"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
include = ["inscope_contract*"]
