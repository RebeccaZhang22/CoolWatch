[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "siliconprospect-guard"
version = "0.1.0"
description = "Python client for the SiliconProspect Guard moderation API"
readme = "siliconprospect_guard/README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "pydantic>=2,<3"]

[tool.setuptools]
packages = ["siliconprospect_guard"]
